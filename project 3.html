<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess my number</title>
    <style>
      @import url("https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: inherit;
      }

      html {
        font-size: 62.5%;
        box-sizing: border-box;
      }

      body {
        font-family: "Press Start 2P", sans-serif;
        color: #eee;
        background-color: #222;
        /* background-color: #60b347; */
      }

      /* LAYOUT */
      header {
        position: relative;
        height: 35vh;
        border-bottom: 7px solid #eee;
      }

      .main {
        height: 65vh;
        color: #eee;
         display: flex;
         align-items: center; 
        justify-content: space-around;
      }

      .left {
        width: min(42%, 52rem);
        margin: 0;
        /* display: flex;
        flex-direction: column;
        align-items: center; */
      }

      .right {
        width: min(42%, 52rem);
        font-size: 2rem;
        margin: 0;
      }

      /* ELEMENTS STYLE */
      h1 {
        font-size: 4rem;
        text-align: center;
        position: absolute;
        width: 100%;
        top: 52%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .number {
        background: #eee;
        color: #333;
        font-size: 6rem;
        width: 15rem;
        padding: 3rem 0rem;
        text-align: center;
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translate(-50%, 50%);
      }

      .between {
        font-size: 1.4rem;
        position: absolute;
        top: 2rem;
        right: 2rem;
      }

      .again {
        position: absolute;
        top: 2rem;
        left: 2rem;
      }

      .input {
        background: none;
        border: 4px solid #eee;
        font-family: inherit;
        color: inherit;
        font-size: 5rem;
        padding: 2.5rem;
        width: 25rem;
        text-align: center;
        display: block;
        margin-bottom: 3rem;
      }

      .btn {
        border: none;
        background-color: #eee;
        color: #222;
        font-size: 2rem;
        font-family: inherit;
        padding: 2rem 3rem;
        cursor: pointer;
      }

      .btn:hover {
        background-color: #ccc;
      }

      .result {
        margin-bottom: 8rem;
        height: 3rem;
      }

      .label-score {
        margin-bottom: 2rem;
      }

      @media (max-width: 700px) {
        header {
          height: 30vh;
          min-height: 18rem;
        }

        .main {
          height: 70vh;
          min-height: 34rem;
          flex-direction: column;
          justify-content: center;
          gap: 2.5rem;
          padding: 7rem 2rem 2rem;
        }

        h1 {
          font-size: clamp(1.8rem, 6vw, 3rem);
        }

        .number {
          width: 10rem;
          padding: 2rem 0;
          font-size: 4rem;
        }

        .between {
          top: 1.5rem;
          right: 1.5rem;
          font-size: 1rem;
        }

        .again {
          top: 1.5rem;
          left: 1.5rem;
        }

        .left,
        .right {
          width: min(100%, 32rem);
          text-align: center;
        }

        .left {
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .input {
          width: min(100%, 25rem);
          padding: 1.5rem;
          font-size: 3rem;
          margin-bottom: 1.5rem;
        }

        .btn {
          padding: 1.5rem 2rem;
          font-size: 1.5rem;
        }

        .result {
          margin-bottom: 2rem;
        }

        .label-score {
          margin-bottom: 1.5rem;
        }
      }

      @media (max-width: 380px) {
        .between {
          top: 6rem;
          left: 50%;
          right: auto;
          transform: translateX(-50%);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="main">
        <button class="btn again">Again!</button>
        <h1>GUESS MY NUMBER</h1>
        <div class="number">?</div>
        <!-- <hr /> -->
        <section class="left">
          <input type="text" class="input" />
          <button class="btn check">Check!</button>
        </section>
        <p class="between">(Between 1 and 20)</p>
        <section class="right">
          <p class="result">Start Guessing ....</p>
          <p class="score">Score : 20</p>
          <BR></BR>
          <p class="highscore">HighScore : 0</p>
        </section>
      </div>
    </header>
    <script src="project 3.js"></script>
  </body>
</html>
